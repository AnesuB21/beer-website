<head>

    <style> 
        body{
            background-color: #DEB887;;
            min-height: 75vh;

        h1{

        background-color: #a87532fe;
        border: none;
        border-radius: 5px;
        width: 200px;

        padding: 15px 15px;
        text-align: center;
        display: inline-block;

        margin: 4px 2px;

        margin-bottom: 60px;

        transition-duration: 0.2s;

        background-color:#a87532fe ;

            color: white;
            text-decoration: none;

    <h2> Give us your Review</h2>
    <table> 
        <tr> 
            <td> Name: </td>
            <td> <input type="text" name="name" value= "" required> </td>
        </tr>
        <tr> 
            <td> Surname: </td>
            <td> <input type="text" name="surname" value= "" required> </td>
        </tr>
        <tr> 
            <td> Contact Number: </td>
            <td> <input type="text" name="number" value= "" required> </td>
        </tr>
        <tr> 
            <td> Email Address: </td>
            <td> <input type="text" name="email" value= "" required> </td>
        </tr>
        <tr>

            <td> <textarea name="review" cols="25" rows="6" value= "" required> </textarea> </td>
        </tr>
        <tr>
